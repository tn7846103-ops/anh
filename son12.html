<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📸 Tải ảnh lên & Đánh giá (Firebase Storage)</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #f5f7fa 0%, #e9edf2 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1300px;
            width: 100%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 2rem 2rem 3rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1), 0 6px 12px rgba(0,0,0,0.05);
        }
        h1 {
            font-weight: 600;
            font-size: 2.6rem;
            letter-spacing: -0.5px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 1rem;
            font-weight: 400;
            color: #475569;
            margin-left: 8px;
        }
        .sync-status {
            background: #dbeafe;
            color: #1e40af;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-left: 12px;
        }
        .sync-status.synced {
            background: #d1fae5;
            color: #065f46;
        }
        .sync-status.error {
            background: #fee2e2;
            color: #991b1b;
        }
        .sync-status.uploading {
            background: #fef3c7;
            color: #92400e;
        }
        .upload-area {
            background: #ffffffcc;
            backdrop-filter: blur(2px);
            border: 2px dashed #94a3b8;
            border-radius: 40px;
            padding: 2rem 2rem;
            margin: 1.8rem 0 2.2rem;
            transition: 0.2s;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }
        .upload-area:hover {
            border-color: #3b82f6;
            background: #f8fafc;
        }
        .upload-label {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #1e293b;
            color: white;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .upload-label:hover {
            background: #0f172a;
            transform: scale(1.02);
        }
        .upload-label input {
            display: none;
        }
        .upload-progress {
            width: 100%;
            margin-top: 12px;
            display: none;
        }
        .upload-progress.active {
            display: block;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 10px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .progress-text {
            font-size: 0.85rem;
            color: #475569;
            margin-top: 4px;
            text-align: center;
        }
        .file-count {
            background: #e2e8f0;
            padding: 8px 22px;
            border-radius: 40px;
            color: #1e293b;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem 1.8rem;
            margin-top: 1rem;
        }
        .photo-card {
            background: white;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 10px 20px -8px rgba(0,0,0,0.12);
            transition: transform 0.15s ease, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            border: 1px solid #ffffff70;
            backdrop-filter: blur(2px);
        }
        .photo-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 30px -12px rgba(0,0,0,0.2);
        }
        .photo-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            background: #d1d9e6;
            cursor: pointer;
            transition: 0.1s;
            border-bottom: 2px solid #f1f5f9;
        }
        .photo-card img:hover {
            opacity: 0.9;
        }
        .photo-card img:active {
            opacity: 0.7;
        }
        .card-body {
            padding: 1.2rem 1.2rem 1.5rem;
            background: white;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .photo-name {
            font-weight: 600;
            color: #0f172a;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rating-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }
        .rating-stars {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .star-btn {
            background: none;
            border: none;
            font-size: 1.9rem;
            line-height: 1;
            padding: 0 2px;
            cursor: pointer;
            color: #cbd5e1;
            transition: 0.1s;
        }
        .star-btn.active {
            color: #fbbf24;
            text-shadow: 0 0 6px #f59e0b50;
        }
        .star-btn:hover {
            transform: scale(1.2);
            color: #f59e0b;
        }
        .star-btn.loading {
            opacity: 0.5;
            pointer-events: none;
        }
        .rating-value {
            font-weight: 500;
            color: #1e293b;
            background: #f1f5f9;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.9rem;
            margin-left: 4px;
        }
        .review-textarea {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 10px 14px;
            font-family: inherit;
            font-size: 0.9rem;
            resize: vertical;
            min-height: 55px;
            transition: 0.15s;
            background: #f8fafc;
        }
        .review-textarea:focus {
            outline: 2px solid #3b82f6;
            background: white;
            border-color: transparent;
        }
        .review-textarea::placeholder {
            color: #94a3b8;
        }
        .review-textarea.loading {
            opacity: 0.6;
            pointer-events: none;
        }
        .card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.1s;
            font-weight: 500;
        }
        .delete-btn:hover {
            background: #fee2e2;
            color: #b91c1c;
        }
        .delete-btn.loading {
            opacity: 0.5;
            pointer-events: none;
        }
        .empty-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 0;
            color: #64748b;
            font-size: 1.2rem;
            background: #f1f5f9;
            border-radius: 60px;
        }
        .footer-note {
            margin-top: 2.5rem;
            color: #475569;
            font-size: 0.9rem;
            text-align: center;
            border-top: 1px solid #d1d9e6;
            padding-top: 2rem;
            opacity: 0.8;
        }
        .loading-overlay {
            display: none;
            text-align: center;
            padding: 2rem;
            color: #475569;
        }
        .loading-overlay.active {
            display: block;
        }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== MODAL XEM ẢNH TO ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: zoomIn 0.3s ease;
        }
        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-content img {
            max-width: 90vw;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            background: #1a1a2e;
        }
        .modal-close {
            position: absolute;
            top: -50px;
            right: -10px;
            background: none;
            border: none;
            color: white;
            font-size: 2.5rem;
            cursor: pointer;
            transition: 0.2s;
            padding: 0 12px;
            line-height: 1;
            opacity: 0.8;
        }
        .modal-close:hover {
            opacity: 1;
            transform: rotate(90deg);
        }
        .modal-info {
            color: white;
            margin-top: 16px;
            text-align: center;
            font-size: 1rem;
            opacity: 0.8;
            max-width: 80vw;
        }
        .modal-info .modal-name {
            font-weight: 600;
            font-size: 1.1rem;
        }
        .modal-info .modal-rating {
            margin-top: 6px;
            color: #fbbf24;
            font-size: 1.2rem;
        }
        .modal-info .modal-review {
            margin-top: 6px;
            color: #cbd5e1;
            font-style: italic;
        }
        @media (max-width: 640px) {
            .container { padding: 1.5rem 1rem; }
            .upload-area { flex-direction: column; gap: 16px; align-items: stretch; }
            .upload-label { justify-content: center; }
            .file-count { text-align: center; }
            h1 { font-size: 1.8rem; }
            .modal-content img {
                max-width: 95vw;
                max-height: 70vh;
            }
            .modal-close {
                top: -40px;
                right: 0;
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>
        🖼️ Thư viện ảnh
        <small>lưu trữ đám mây</small>
        <span class="sync-status" id="syncStatus">🔄 Đang kết nối...</span>
    </h1>

    <div class="upload-area">
        <label class="upload-label" for="fileInput">
            <span>📤</span> Chọn ảnh
            <input type="file" id="fileInput" accept="image/*" multiple />
        </label>
        <span class="file-count" id="fileCount">0 ảnh</span>
        <div class="upload-progress" id="uploadProgress">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Đang tải lên...</div>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p>Đang tải dữ liệu từ đám mây...</p>
    </div>

    <div class="gallery" id="galleryContainer">
        <div class="empty-message">✨ Chưa có ảnh nào. Hãy tải lên những bức ảnh đầu tiên!</div>
    </div>
    <div class="footer-note">
        ⭐ Nhấn vào ảnh để xem to hơn · Ảnh được lưu trên Firebase Storage (giữ nguyên chất lượng)
    </div>
</div>

<!-- ===== MODAL XEM ẢNH TO ===== -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <img id="modalImage" src="" alt="Ảnh phóng to" />
        <div class="modal-info">
            <div class="modal-name" id="modalName">Tên ảnh</div>
            <div class="modal-rating" id="modalRating">⭐ 0/5</div>
            <div class="modal-review" id="modalReview">Chưa có nhận xét</div>
        </div>
    </div>
</div>

<script>
    (function() {
        // =============================================
        // 1. CẤU HÌNH FIREBASE
        // =============================================
        const firebaseConfig = {
            apiKey: "AIzaSyAVEmbUKmOMJA_E3WYJxJV4rBXGZKyavSI",
            authDomain: "photo-4dc90.firebaseapp.com",
            projectId: "photo-4dc90",
            storageBucket: "photo-4dc90.firebasestorage.app",
            messagingSenderId: "66023765491",
            appId: "1:66023765491:web:b49696fb2c79bb30620e86"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();
        
        db.enablePersistence()
            .then(() => console.log('✅ Offline persistence enabled'))
            .catch(err => console.warn('⚠️ Offline persistence error:', err));

        // =============================================
        // 2. BIẾN TOÀN CỤ
        // =============================================
        const COLLECTION_NAME = 'photos';
        let photos = [];
        let unsubscribe = null;

        const gallery = document.getElementById('galleryContainer');
        const fileInput = document.getElementById('fileInput');
        const fileCount = document.getElementById('fileCount');
        const syncStatus = document.getElementById('syncStatus');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const uploadProgress = document.getElementById('uploadProgress');

        // Modal elements
        const modalOverlay = document.getElementById('modalOverlay');
        const modalImage = document.getElementById('modalImage');
        const modalName = document.getElementById('modalName');
        const modalRating = document.getElementById('modalRating');
        const modalReview = document.getElementById('modalReview');

        // =============================================
        // 3. HÀM HIỆN MODAL
        // =============================================
        window.openModal = function(photoId) {
            const photo = photos.find(p => p.id === photoId);
            if (!photo) return;

            modalImage.src = photo.src;
            modalImage.alt = photo.name;
            modalName.textContent = '📎 ' + photo.name;
            
            const stars = '⭐'.repeat(photo.rating) + '☆'.repeat(5 - photo.rating);
            modalRating.textContent = stars + ' ' + photo.rating + '/5';
            
            modalReview.textContent = photo.review && photo.review.trim() !== '' 
                ? '💬 "' + photo.review + '"' 
                : '📝 Chưa có nhận xét';

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        };

        window.closeModal = function(e) {
            if (e && e.target !== e.currentTarget) return;
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        };

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // =============================================
        // 4. HÀM ĐỒNG BỘ VỚI FIRESTORE
        // =============================================
        function updateSyncStatus(status, message) {
            syncStatus.textContent = message || status;
            syncStatus.className = 'sync-status';
            if (status === 'synced') {
                syncStatus.classList.add('synced');
                syncStatus.textContent = '✅ Đã đồng bộ';
            } else if (status === 'error') {
                syncStatus.classList.add('error');
                syncStatus.textContent = '❌ ' + (message || 'Lỗi kết nối');
            } else if (status === 'loading') {
                syncStatus.textContent = '🔄 ' + (message || 'Đang đồng bộ...');
            } else if (status === 'uploading') {
                syncStatus.classList.add('uploading');
                syncStatus.textContent = '📤 ' + (message || 'Đang tải lên...');
            }
        }

        function listenToFirestore() {
            loadingOverlay.classList.add('active');
            updateSyncStatus('loading', 'Đang tải dữ liệu...');

            if (unsubscribe) {
                unsubscribe();
                unsubscribe = null;
            }

            unsubscribe = db.collection(COLLECTION_NAME)
                .orderBy('createdAt', 'desc')
                .onSnapshot((snapshot) => {
                    loadingOverlay.classList.remove('active');
                    
                    if (snapshot.empty) {
                        photos = [];
                        renderGallery();
                        updateSyncStatus('synced');
                        return;
                    }

                    const newPhotos = [];
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        newPhotos.push({
                            id: doc.id,
                            name: data.name || 'Không tên',
                            src: data.src || '',
                            rating: data.rating || 0,
                            review: data.review || '',
                            createdAt: data.createdAt || new Date()
                        });
                    });

                    photos = newPhotos;
                    renderGallery();
                    updateSyncStatus('synced');
                    
                }, (error) => {
                    console.error('Firestore error:', error);
                    loadingOverlay.classList.remove('active');
                    updateSyncStatus('error', error.message);
                    
                    setTimeout(() => {
                        if (!unsubscribe) {
                            listenToFirestore();
                        }
                    }, 5000);
                });
        }

        // =============================================
        // 5. UPLOAD ẢNH LÊN FIREBASE STORAGE
        // =============================================
        function uploadPhotosToFirebase(files) {
            if (!files || files.length === 0) return;

            const imageFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
            if (imageFiles.length === 0) {
                alert('Vui lòng chọn file ảnh (jpg, png, gif, webp...)');
                return;
            }

            let uploaded = 0;
            const total = imageFiles.length;
            
            // Hiển thị progress bar
            uploadProgress.classList.add('active');
            progressFill.style.width = '0%';
            progressText.textContent = `Đang tải lên 0/${total} ảnh...`;
            updateSyncStatus('uploading', `Đang tải lên ${total} ảnh...`);

            imageFiles.forEach((file, index) => {
                // Tạo tên file duy nhất
                const fileName = Date.now() + '_' + index + '_' + file.name;
                const storageRef = storage.ref('photos/' + fileName);

                // Upload lên Storage
                const uploadTask = storageRef.put(file);

                uploadTask.on(
                    'state_changed',
                    (snapshot) => {
                        // Theo dõi tiến trình upload của từng file
                        const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                        const overallProgress = ((uploaded + (progress / 100)) / total) * 100;
                        progressFill.style.width = overallProgress + '%';
                        progressText.textContent = `Đang tải lên ${uploaded + 1}/${total} ảnh... (${Math.round(progress)}%)`;
                    },
                    (error) => {
                        console.error('Upload error:', error);
                        uploaded++;
                        if (uploaded === total) {
                            uploadProgress.classList.remove('active');
                            updateSyncStatus('error', 'Lỗi tải lên một số ảnh');
                            fileInput.value = '';
                        }
                    },
                    () => {
                        // Upload thành công, lấy URL
                        storageRef.getDownloadURL().then((url) => {
                            // Lưu URL vào Firestore
                            db.collection(COLLECTION_NAME).add({
                                name: file.name,
                                src: url, // URL từ Storage
                                rating: 0,
                                review: '',
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            })
                            .then(() => {
                                uploaded++;
                                if (uploaded === total) {
                                    uploadProgress.classList.remove('active');
                                    progressFill.style.width = '100%';
                                    progressText.textContent = '✅ Tải lên hoàn tất!';
                                    updateSyncStatus('synced');
                                    fileInput.value = '';
                                    
                                    setTimeout(() => {
                                        progressFill.style.width = '0%';
                                    }, 2000);
                                }
                            })
                            .catch((error) => {
                                console.error('Lỗi lưu Firestore:', error);
                                uploaded++;
                                if (uploaded === total) {
                                    uploadProgress.classList.remove('active');
                                    updateSyncStatus('error', 'Lỗi lưu dữ liệu');
                                    fileInput.value = '';
                                }
                            });
                        });
                    }
                );
            });
        }

        // =============================================
        // 6. CẬP NHẬT DỮ LIỆU (Rating, Review)
        // =============================================
        function updatePhotoField(photoId, field, value) {
            db.collection(COLLECTION_NAME).doc(photoId).update({
                [field]: value
            })
            .then(() => {
                console.log(`✅ Updated ${field} for ${photoId}`);
            })
            .catch((error) => {
                console.error('Lỗi cập nhật:', error);
                updateSyncStatus('error', 'Lỗi cập nhật dữ liệu');
                setTimeout(() => {
                    db.collection(COLLECTION_NAME).doc(photoId).update({
                        [field]: value
                    }).catch(err => console.error('Retry failed:', err));
                }, 2000);
            });
        }

        // =============================================
        // 7. XÓA ẢNH (Xóa cả Storage và Firestore)
        // =============================================
        function deletePhoto(photoId, photoName, photoSrc) {
            if (!confirm(`Xóa ảnh "${photoName}" ?`)) return;

            // Xóa ảnh khỏi Storage
            try {
                const storageRef = firebase.storage().refFromURL(photoSrc);
                storageRef.delete().catch(err => console.warn('Storage delete error:', err));
            } catch (e) {
                console.warn('Không thể xóa từ Storage:', e);
            }

            // Xóa document khỏi Firestore
            db.collection(COLLECTION_NAME).doc(photoId).delete()
                .then(() => {
                    console.log('✅ Đã xóa ảnh');
                    updateSyncStatus('synced');
                })
                .catch((error) => {
                    console.error('Lỗi xóa:', error);
                    updateSyncStatus('error', 'Lỗi xóa ảnh');
                });
        }

        // =============================================
        // 8. RENDER GALLERY
        // =============================================
        function renderGallery() {
            if (photos.length === 0) {
                gallery.innerHTML = `<div class="empty-message">✨ Chưa có ảnh nào. Hãy tải lên những bức ảnh đầu tiên!</div>`;
                fileCount.textContent = '0 ảnh';
                return;
            }

            fileCount.textContent = `${photos.length} ảnh`;

            let html = '';
            photos.forEach((photo) => {
                let starsHtml = '';
                const maxStars = 5;
                for (let i = 1; i <= maxStars; i++) {
                    const activeClass = (photo.rating >= i) ? 'active' : '';
                    starsHtml += `<button class="star-btn ${activeClass}" data-id="${photo.id}" data-star="${i}">★</button>`;
                }

                const reviewText = photo.review || '';

                html += `
                    <div class="photo-card" data-id="${photo.id}">
                        <img src="${photo.src}" alt="${photo.name}" loading="lazy" onclick="openModal('${photo.id}')" />
                        <div class="card-body">
                            <div class="photo-name" title="${photo.name}">📎 ${photo.name}</div>
                            <div class="rating-section">
                                <div class="rating-stars">
                                    ${starsHtml}
                                    <span class="rating-value">${photo.rating || 0}★</span>
                                </div>
                                <textarea class="review-textarea" placeholder="Viết cảm nhận về ảnh..." data-id="${photo.id}">${reviewText}</textarea>
                            </div>
                            <div class="card-actions">
                                <button class="delete-btn" data-id="${photo.id}">🗑️ Xóa ảnh</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            gallery.innerHTML = html;
        }

        // =============================================
        // 9. XỬ LÝ SỰ KIỆN
        // =============================================
        function handleGalleryClick(e) {
            const target = e.target;

            // Xóa ảnh
            if (target.classList.contains('delete-btn')) {
                const id = target.dataset.id;
                if (!id) return;
                const photo = photos.find(p => p.id === id);
                if (!photo) return;
                target.classList.add('loading');
                deletePhoto(id, photo.name, photo.src);
                return;
            }

            // Đánh giá sao
            if (target.classList.contains('star-btn')) {
                const id = target.dataset.id;
                const starValue = Number(target.dataset.star);
                if (!id || !starValue) return;

                const photo = photos.find(p => p.id === id);
                if (!photo) return;

                const newRating = (photo.rating === starValue) ? 0 : starValue;
                target.classList.add('loading');
                
                photo.rating = newRating;
                renderGallery();
                
                updatePhotoField(id, 'rating', newRating);
                return;
            }
        }

        let reviewTimeout = null;
        function handleReviewInput(e) {
            const target = e.target;
            if (!target.classList.contains('review-textarea')) return;

            const id = target.dataset.id;
            if (!id) return;

            const photo = photos.find(p => p.id === id);
            if (!photo) return;

            const newReview = target.value;
            photo.review = newReview;
            
            clearTimeout(reviewTimeout);
            reviewTimeout = setTimeout(() => {
                updatePhotoField(id, 'review', newReview);
            }, 800);
        }

        // =============================================
        // 10. KHỞI TẠO
        // =============================================
        
        fileInput.addEventListener('change', function(e) {
            uploadPhotosToFirebase(e.target.files);
        });

        gallery.addEventListener('click', handleGalleryClick);
        gallery.addEventListener('input', handleReviewInput);

        const uploadArea = document.querySelector('.upload-area');
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#3b82f6';
            uploadArea.style.background = '#f0f7ff';
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#94a3b8';
            uploadArea.style.background = '#ffffffcc';
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#94a3b8';
            uploadArea.style.background = '#ffffffcc';
            const files = e.dataTransfer.files;
            if (files && files.length > 0) {
                uploadPhotosToFirebase(files);
            }
        });

        listenToFirestore();

        console.log('☁️ Đang kết nối với Firebase...');
        console.log('📸 Ảnh được lưu trên Firebase Storage (giữ nguyên chất lượng)');
        console.log('✅ Đã cấu hình Storage cho project: photo-4dc90');
    })();
</script>
